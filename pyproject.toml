[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mixdist"
# Single-sourced from src/mixdist/__init__.py — see [tool.hatch.version] below.
dynamic = ["version"]
description = "Distances, nearest-neighbour search and clustering for mixed numeric/categorical tabular data."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Atom Matsuda" }]
keywords = [
    "clustering",
    "gower",
    "mixed-type",
    "categorical",
    "distance",
    "nearest-neighbors",
    "kamila",
    "k-prototypes",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.22", "pandas>=1.4"]

[project.optional-dependencies]
test = ["pytest>=7", "scikit-learn>=1.1"]
# `gower` powers the cross-validation tests; those tests skip when it is absent.
dev = ["pytest>=7", "scikit-learn>=1.1", "ruff>=0.5", "gower>=0.1.2"]

[project.urls]
Homepage = "https://github.com/tomtomtom1007/mixdist"
Issues = "https://github.com/tomtomtom1007/mixdist/issues"
Changelog = "https://github.com/tomtomtom1007/mixdist/blob/main/CHANGELOG.md"

[tool.hatch.version]
# The one place a release version is written.
path = "src/mixdist/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mixdist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
